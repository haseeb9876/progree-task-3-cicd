name: Task 3 - CI and test deployment
run-name: Task 3 | ${{ github.ref_name }} | ${{ github.sha }}

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task3-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and unit tests (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Check out pushed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci --no-audit --no-fund
      - name: Lint application source
        working-directory: ${{ matrix.component }}
        run: npm run lint
      - name: Check frontend types
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm run typecheck
      - name: Run unit and component tests
        working-directory: ${{ matrix.component }}
        run: npm run test:ci
      - name: Write test summary
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
        run: python3 scripts/ci/report.py tests
      - name: Save test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ matrix.component }}/reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build immutable application images
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ github.sha }}
      APP_REVISION: ${{ github.sha }}
    steps:
      - name: Check out tested code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build multi-stage images
        run: |
          mkdir -p .ci-artifacts
          docker compose build 2>&1 | tee .ci-artifacts/build.log
          python3 scripts/ci/images.py capture
      - name: Package the exact built images
        run: |
          docker save "progree-task3-frontend:${IMAGE_TAG}" "progree-task3-backend:${IMAGE_TAG}" | gzip > .ci-artifacts/application-images.tar.gz
          sha256sum .ci-artifacts/application-images.tar.gz > .ci-artifacts/application-images.sha256
      - name: Transfer images to deployment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-images-${{ github.run_id }}
          path: |
            .ci-artifacts/application-images.tar.gz
            .ci-artifacts/application-images.sha256
            .ci-artifacts/image-manifest.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
      - name: Save build output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-${{ github.run_id }}
          path: .ci-artifacts/build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy and verify the test environment
    needs: [quality, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: task3-test
    env:
      COMPOSE_PROJECT_NAME: progree-ci-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_PORT: '8080'
      IMAGE_TAG: ${{ github.sha }}
      APP_REVISION: ${{ github.sha }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-images-${{ github.run_id }}
          path: .ci-artifacts
      - name: Verify and load images
        run: |
          sha256sum --check .ci-artifacts/application-images.sha256
          gzip -dc .ci-artifacts/application-images.tar.gz | docker load
      - name: Start the application and verify its revision
        id: rollout
        run: python3 scripts/ci/deploy.py
      - name: Exercise the deployed application
        id: smoke
        run: python3 scripts/verify-stack.py --url http://127.0.0.1:8080 2>&1 | tee .ci-artifacts/smoke-tests.txt
      - name: Collect service status and redacted logs
        if: always()
        run: python3 scripts/ci/report.py collect
      - name: Remove the temporary test deployment
        id: cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Report deployment status and metrics
        if: always()
        env:
          ROLLOUT_RESULT: ${{ steps.rollout.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
        run: python3 scripts/ci/report.py deployment
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: |
            .ci-artifacts/deployment.json
            .ci-artifacts/deployment-summary.md
            .ci-artifacts/service-status.json
            .ci-artifacts/service-logs.txt
            .ci-artifacts/smoke-tests.txt
            .ci-artifacts/image-manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Pipeline status board
    if: always()
    needs: [quality, build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out reporting script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish stage outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/report.py workflow
